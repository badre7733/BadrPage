<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Terminal window -->
  <rect width="160" height="44" rx="10" fill="url(#bg)"/>
  <!-- Title bar -->
  <rect width="160" height="13" rx="10" fill="#1e293b"/>
  <rect y="5" width="160" height="8" fill="#1e293b"/>
  <!-- Traffic lights -->
  <circle cx="11" cy="6.5" r="2.8" fill="#ef4444"/>
  <circle cx="20" cy="6.5" r="2.8" fill="#eab308"/>
  <circle cx="29" cy="6.5" r="2.8" fill="#22c55e"/>
  <!-- Prompt text -->
  <text x="12" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#94a3b8">$</text>
  <text x="26" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#3b82f6">Bdr</text>
  <text x="58" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#22c55e">&gt;_</text>
  <!-- Blinking cursor -->
  <rect x="86" y="22" width="7" height="13" rx="1" fill="#22c55e">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
